paths:
  dataDir: ${appData}/omity-agent

server:
  host: 127.0.0.1
  port: 3030

access:
  publicOrigin:
  trustedProxies: []
  challengeTtlMs: 300000
  sessionTtlMs: 43200000
  loginRateLimit:
    attempts: 10
    windowMs: 60000

attachments:
  allowedSuffixes:
    - .txt
    - .md
    - .json
    - .yaml
    - .yml
    - .csv
    - .log
    - .pdf
    - .png
    - .jpg
    - .jpeg
    - .webp
  maxSizeBytes: 10485760

frontend:
  draftSaveDelayMs: 500
  transcriptRefreshIntervalMs: 25

host:
  pollMs: 300
  pausePollMs: 500
  idleLogMs: 25000
  shutdownTimeoutMs: 10000

logging:
  level: info
  streamTokens: false

leases:
  hostTtlMs: 30000
