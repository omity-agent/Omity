# Hook 按配置顺序执行；工具名使用重命名后的最终 MCP 工具名。
# runLimit 是整个 session 的运行上限；0 为关闭，-1 为无限次。
# id 必须唯一；整个文件支持全局变量和会话变量：
# - ${appData}: 当前操作系统的应用数据目录
# - ${ENV_NAME}: 对应的操作系统环境变量
# - ${cwd}: 当前会话的用户工作目录
# - ${session}: 当前会话的数据文件夹
# args 还支持按执行顺序引用已完成的工具输出，N 是从 1 开始的正整数：
# - ${toolOutputs.fromStart.N.output}: 从前往后第 N 个工具的 ToolMessage.content
# - ${toolOutputs.fromEnd.N.output}: 从后往前第 N 个工具的 ToolMessage.content
# - ${toolOutputs.fromStart.N.structuredOutput}: 从前往后第 N 个 MCP 工具的结构化输出
# - ${toolOutputs.fromEnd.N.structuredOutput}: 从后往前第 N 个 MCP 工具的结构化输出
# 历史在本次 Agent 运行内累计，Hook 工具与 Agent 原始工具都会计入。
# 变量独占参数值时保留原始类型；嵌入字符串时只能使用标量输出。
#
# hooks:
#   - id: format-after-user
#     target: agent
#     when: before
#     runLimit: -1
#     mode: silent
#     tool: formatter
#     args: { path: "${cwd}" }
#   - id: notify-after-answer
#     target: agent
#     when: after
#     runLimit: 1
#     mode: silent
#     tool: notify
#     args: { result: "${toolOutputs.fromEnd.1.output}" }
#   - id: check-before-write
#     target: write_file
#     when: before
#     runLimit: -1
#     mode: takeover
#     tool: validate
#     args: {}
#   - id: format-after-write
#     target: write_file
#     when: after
#     runLimit: 3
#     mode: silent
#     tool: formatter
#     args: { path: . }
hooks:
  - id: open-terminal
    target: agent
    when: before
    runLimit: 1
    mode: takeover
    tool: terminal__new_tab
    args:
      starting_directory: "${cwd}"
      starting_shell: powershell
  - id: read-agents-md
    target: agent
    when: before
    runLimit: 1
    mode: takeover
    tool: terminal__send_command
    args:
      tab_id: "${toolOutputs.fromEnd.1.structuredOutput.tab_id}"
      command: Get-Content -LiteralPath .\AGENTS.md -Raw
      waiting: 5
  - id: create-temp-folder
    target: agent
    when: before
    runLimit: 1
    mode: silent
    tool: terminal__send_command
    args:
      tab_id: ${toolOutputs.fromStart.1.structuredOutput.tab_id}
      command: New-Item -ItemType Directory -Path "${session}/temp"
      waiting: 5
