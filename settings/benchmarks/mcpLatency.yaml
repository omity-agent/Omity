warmup: 8 # 预热次数，不纳入统计。
samples: 40 # 正式样本数，每次使用独立会话。
timeoutMs: 30000 # 单次完整测试的超时上限，包含会话准备。

context:
  targetTokens: 100000 # 本地估算；不含消息协议包装和不透明的加密推理。
  humanMessages: 3 # 包括本轮待处理的用户输入。
  assistantOnlyMessages: 1 # 没有工具调用的历史助手消息。
  assistantTextMessages: 11 # 含正文的历史助手消息数。
  reasoningMessages: 25 # 含推理摘要和模拟加密载荷的历史助手消息数。
  reasoningParts: 53 # 推理摘要片段总数，同一消息的片段共享推理 ID。
  encryptedReasoningCharacters: 90000 # 仅保留体积，不使用真实加密内容。
  distinctHistoryTools: 7 # 历史中交替使用的工具种类。
  customToolCalls: 7 # 其中以 free-form 方式传参的历史调用数。
  toolDefinitions: 56 # 模型收到的工具定义数量。
  systemTokens: 2700 # 系统提示词预算。
  definitionTokens: 6600 # 工具定义预算，包含名称和 JSON Schema。
  humanTokens: 150 # 全部用户输入的文本预算。
  assistantTokens: 1600 # 全部助手正文的文本预算。
  reasoningTokens: 350 # 全部推理摘要的文本预算。
  argumentTokens: 9600 # 全部历史工具参数预算，包含 JSON 包装。
  # 工具输出的相对长度分布；按剩余 token 预算同比缩放。
  # 只保存代表会话的统计量，不含原消息、路径、工具名称或密钥。
