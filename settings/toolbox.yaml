toolboxes:
  # 内置工具按实现标识配置；name 是向模型公开的名称。
  choice:
    enabled: true
    name: ask_user__choice
    description: ""
    parameters:
      multiple:
        description: ""
      options:
        description: ""
        itemDescription: ""
        minLength: 1 # 每个选项的最小字符串长度。
        minItems: 0 # 允许不提供选项，仅由用户填写备注。
      question:
        description: ""
        minLength: 1
  open_ended:
    enabled: true
    name: ask_user__open_ended
    description: ""
    parameters:
      question:
        description: ""
        minLength: 1
  update_title:
    enabled: true
    name: update_title
    description: 更新当前 Session 的标题。标题的功能是让用户能够在 Session 列表快速重新找到该 Session，所以标题应简短且信息密度高，代表完整对话轨迹而不是末状态。标题不应包含逗号。你应经常更新 Session 标题，确保其始终足够贴切。在本 Session 第一次对话结束前，你至少更新一次标题。
    parameters:
      title:
        description: ""
        minLength: 5 # 标题长度下限。
        maxLength: 30 # 标题长度上限。
    errors:
      invalidLength: 标题长度超出允许的可见字符范围
      missingSession: 更新标题工具缺少当前会话 ID
stdio:
  restart:
    delayMs: 1000
    maxAttempts: 3
mcpServers: {}
toolNameOverrides: {}
toolDescriptionOverrides: {}
freeformToolInputs: []
